name: Deploy Swagger UI

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - '.github/workflows/swagger-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-swagger:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build project
        run: ./gradlew build -x test --no-daemon

      - name: Start application
        run: |
          java -jar build/libs/*.jar &
          echo $! > app.pid
          echo "Waiting for application to start..."
          timeout 60 bash -c 'until curl -f http://localhost:8080/v3/api-docs.yaml > /dev/null 2>&1; do sleep 2; done' || exit 1

      - name: Generate OpenAPI YAML
        run: |
          curl http://localhost:8080/v3/api-docs.yaml -o openapi.yaml
          echo "Generated OpenAPI spec:"
          head -n 20 openapi.yaml

      - name: Stop application
        run: |
          kill $(cat app.pid) || true

      - name: Generate Swagger UI
        uses: Legion2/swagger-ui-action@v1
        with:
          output: swagger-ui
          spec-file: openapi.yaml

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./swagger-ui
          publish_branch: github-pages
          force_orphan: true

