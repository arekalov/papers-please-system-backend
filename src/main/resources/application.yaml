spring:
  application:
    name: papersplease
  
  web:
    resources:
      add-mappings: false
  
  mvc:
    throw-exception-if-no-handler-found: true
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-fancy-mud-a4icq7ux-pooler.us-east-1.aws.neon.tech/neondb?sslmode=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_AQuTw7XShcL6}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        jdbc:
          time_zone: UTC
    open-in-view: false
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false
    out-of-order: true
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
    time-zone: UTC
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: ${JWT_SECRET:default-secret-key-please-change-in-production}
  expiration: 86400000

god:
  secret-key: ${GOD_SECRET_KEY:super-secret-god-key-change-in-production}

logging:
  level:
    root: INFO
    com.arekalov.papersplease: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false
  writer-with-default-pretty-printer: true
  paths-to-match: /api/v1/**

