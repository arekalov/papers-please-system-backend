version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: papersplease-app
    environment:
      # Neon PostgreSQL подключение (из application.yaml по умолчанию)
      # Можно переопределить через .env файл:
      DB_URL: ${DB_URL:-jdbc:postgresql://ep-fancy-mud-a4icq7ux-pooler.us-east-1.aws.neon.tech/neondb?sslmode=require}
      DB_USERNAME: ${DB_USERNAME:-neondb_owner}
      DB_PASSWORD: ${DB_PASSWORD:-npg_AQuTw7XShcL6}
      
      # JWT секреты
      JWT_SECRET: ${JWT_SECRET:-default-secret-key-please-change-in-production}
      GOD_SECRET_KEY: ${GOD_SECRET_KEY:-super-secret-god-key-change-in-production}
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s


